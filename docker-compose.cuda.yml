services:
  whisper:
    image: hwdsl2/whisper-server:cuda
    container_name: windows-voice-input-whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - whisper-data:/var/lib/whisper
      - ./whisper.env:/whisper.env:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper-data:
